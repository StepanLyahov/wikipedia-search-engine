services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: wiki
      POSTGRES_USER: wiki
      POSTGRES_PASSWORD: wiki
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wiki -d wiki"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro

  crawler:
    build:
      context: ./crawler
    environment:
      DATABASE_URL: postgres://wiki:wiki@postgres:5432/wiki?sslmode=disable
      CRAWLER_SEED_URL: ${CRAWLER_SEED_URL:-https://en.wikipedia.org/wiki/Elasticsearch}
      CRAWLER_MAX_DEPTH: ${CRAWLER_MAX_DEPTH:-2}
      CRAWLER_MAX_PAGES: ${CRAWLER_MAX_PAGES:-100}
      CRAWLER_REQUEST_TIMEOUT: ${CRAWLER_REQUEST_TIMEOUT:-15s}
      CRAWLER_USER_AGENT: ${CRAWLER_USER_AGENT:-wikipedia-search-engine-crawler/1.0}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    healthcheck:
      test: ["CMD-SHELL", "curl -fs 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
    ports:
      - "${ELASTICSEARCH_PORT:-9200}:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data

  embedding-service:
    build:
      context: ./embedding-service
    environment:
      GRPC_PORT: "50051"
      EMBEDDING_MODEL_NAME: ${EMBEDDING_MODEL_NAME:-all-MiniLM-L6-v2}
      GRPC_MAX_WORKERS: ${EMBEDDING_GRPC_MAX_WORKERS:-10}
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('localhost', 50051), timeout=2).close()"]
      interval: 5s
      timeout: 3s
      retries: 20
    ports:
      - "${EMBEDDING_SERVICE_PORT:-50051}:50051"

  indexer:
    build:
      context: ./indexer
    environment:
      DATABASE_URL: postgres://wiki:wiki@postgres:5432/wiki?sslmode=disable
      ELASTICSEARCH_URL: http://elasticsearch:9200
      ELASTICSEARCH_INDEX: ${ELASTICSEARCH_INDEX:-wiki_pages}
      INDEXER_REQUEST_TIMEOUT: ${INDEXER_REQUEST_TIMEOUT:-15s}
      INDEXER_BATCH_SIZE: ${INDEXER_BATCH_SIZE:-500}
      EMBEDDING_SERVICE_ADDR: embedding-service:50051
      INDEXER_EMBEDDING_TIMEOUT: ${INDEXER_EMBEDDING_TIMEOUT:-15s}
      INDEXER_EMBEDDING_DIMS: ${INDEXER_EMBEDDING_DIMS:-384}
    depends_on:
      postgres:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      embedding-service:
        condition: service_healthy
      crawler:
        condition: service_completed_successfully
    restart: "no"

  search-api:
    build:
      context: ./search-api
    environment:
      HTTP_ADDR: ":8080"
      ELASTICSEARCH_URL: http://elasticsearch:9200
      ELASTICSEARCH_INDEX: ${ELASTICSEARCH_INDEX:-wiki_pages}
      SEARCH_API_REQUEST_TIMEOUT: ${SEARCH_API_REQUEST_TIMEOUT:-15s}
      SEARCH_API_SHUTDOWN_TIMEOUT: ${SEARCH_API_SHUTDOWN_TIMEOUT:-5s}
      SEARCH_API_DEFAULT_SIZE: ${SEARCH_API_DEFAULT_SIZE:-10}
      SEARCH_API_MAX_SIZE: ${SEARCH_API_MAX_SIZE:-100}
      SEARCH_API_DEFAULT_K: ${SEARCH_API_DEFAULT_K:-10}
      SEARCH_API_MAX_K: ${SEARCH_API_MAX_K:-100}
      SEARCH_API_NUM_CANDIDATES: ${SEARCH_API_NUM_CANDIDATES:-100}
      EMBEDDING_SERVICE_ADDR: embedding-service:50051
      SEARCH_API_EMBEDDING_TIMEOUT: ${SEARCH_API_EMBEDDING_TIMEOUT:-15s}
    ports:
      - "${SEARCH_API_PORT:-8080}:8080"
    depends_on:
      elasticsearch:
        condition: service_healthy
      embedding-service:
        condition: service_healthy
      indexer:
        condition: service_completed_successfully

volumes:
  postgres_data:
  elasticsearch_data:
