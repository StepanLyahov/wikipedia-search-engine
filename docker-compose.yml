services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: wiki
      POSTGRES_USER: wiki
      POSTGRES_PASSWORD: wiki
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wiki -d wiki"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro

  crawler:
    build:
      context: ./crawler
    environment:
      DATABASE_URL: postgres://wiki:wiki@postgres:5432/wiki?sslmode=disable
      CRAWLER_SEED_URL: ${CRAWLER_SEED_URL:-https://en.wikipedia.org/wiki/Elasticsearch}
      CRAWLER_MAX_DEPTH: ${CRAWLER_MAX_DEPTH:-2}
      CRAWLER_MAX_PAGES: ${CRAWLER_MAX_PAGES:-100}
      CRAWLER_REQUEST_TIMEOUT: ${CRAWLER_REQUEST_TIMEOUT:-15s}
      CRAWLER_USER_AGENT: ${CRAWLER_USER_AGENT:-wikipedia-search-engine-crawler/1.0}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

volumes:
  postgres_data:
